[project]
name = "industrial-control-benchmark"
version = "0.1.0"
description = "Industrial time-series forecasting benchmark with historical exogenous variables and known future controls."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[project.optional-dependencies]
prepare = ["pandas>=2.0", "scipy>=1.10"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["icb*"]

